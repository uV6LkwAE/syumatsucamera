name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: syumatsucamera-prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
  NODE_VERSION: ${{ vars.NODE_VERSION }}

jobs:
  # フェーズ1: CI（アプリの基本チェック）
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Django check
        working-directory: backend
        env:
          CI_SKIP_REQUIRED_ENV_CHECK: "True"
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://127.0.0.1:6379/0
          REDIS_CONNECT_TIMEOUT: "1"
          REDIS_SOCKET_TIMEOUT: "1"
        run: python manage.py check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm install --include=optional

      - name: Install rollup linux native package
        working-directory: frontend
        run: npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  # フェーズ2: Dockerイメージ Build / Push（本番は常時実行）
  build_and_push:
    name: Build And Push Images
    runs-on: ubuntu-latest
    needs:
      - ci
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      nginx_image: ${{ steps.meta.outputs.nginx_image }}
      backend_digest: ${{ steps.backend_build.outputs.digest }}
      nginx_digest: ${{ steps.nginx_build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${{ secrets.REGISTRY_HOST }}/${{ vars.REGISTRY_REPOSITORY }}/backend" >> "$GITHUB_OUTPUT"
          echo "nginx_image=${{ secrets.REGISTRY_HOST }}/${{ vars.REGISTRY_REPOSITORY }}/nginx" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker mTLS client certificate
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          MTLS_CLIENT_CERT: ${{ secrets.MTLS_CLIENT_CERT }}
          MTLS_CLIENT_KEY: ${{ secrets.MTLS_CLIENT_KEY }}
        run: |
          test -n "${REGISTRY_HOST}"
          test -n "${MTLS_CLIENT_CERT}"
          test -n "${MTLS_CLIENT_KEY}"

          cert_dir="/etc/docker/certs.d/${REGISTRY_HOST}"
          sudo mkdir -p "${cert_dir}"

          # Secretsに実改行で登録した場合/ \n 文字列で登録した場合の両方を正規化
          cert_payload="${MTLS_CLIENT_CERT}"
          key_payload="${MTLS_CLIENT_KEY}"
          cert_payload="${cert_payload//\\n/$'\n'}"
          key_payload="${key_payload//\\n/$'\n'}"
          cert_payload="${cert_payload//$'\r'/}"
          key_payload="${key_payload//$'\r'/}"

          printf '%s\n' "${cert_payload}" | sudo tee "${cert_dir}/client.cert" > /dev/null
          printf '%s\n' "${key_payload}" | sudo tee "${cert_dir}/client.key" > /dev/null

          sudo chmod 644 "${cert_dir}/client.cert"
          sudo chmod 600 "${cert_dir}/client.key"

          # 配置確認（内容は出さない）
          echo "cert_dir=${cert_dir}"
          sudo ls -ld /etc/docker /etc/docker/certs.d "${cert_dir}"
          sudo ls -l "${cert_dir}"
          sudo test -s "${cert_dir}/client.cert"
          sudo test -s "${cert_dir}/client.key"

          # PEMヘッダー存在確認
          sudo grep -q "BEGIN CERTIFICATE" "${cert_dir}/client.cert"
          sudo grep -Eq "BEGIN (RSA |EC |)PRIVATE KEY" "${cert_dir}/client.key"

          # opensslで構文確認（内容は出さない）
          sudo openssl x509 -in "${cert_dir}/client.cert" -noout
          sudo openssl pkey -in "${cert_dir}/client.key" -noout

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build backend image
        id: backend_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile/backend.dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:latest
            ${{ steps.meta.outputs.backend_image }}:${{ github.sha }}

      - name: Build nginx image
        id: nginx_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile/nginx.dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.nginx_image }}:latest
            ${{ steps.meta.outputs.nginx_image }}:${{ github.sha }}

  # フェーズ3: デプロイ（常時実行）
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - build_and_push
    environment: production
    steps:
      - name: Deploy phase plan
        run: |
          echo "Target endpoint: https://apply.syumatsucamera.com/"
          echo "Mode: mTLS request (POST)"

      - name: Configure mTLS cert for deploy request
        env:
          MTLS_CLIENT_CERT: ${{ secrets.MTLS_CLIENT_CERT }}
          MTLS_CLIENT_KEY: ${{ secrets.MTLS_CLIENT_KEY }}
        run: |
          test -n "${MTLS_CLIENT_CERT}"
          test -n "${MTLS_CLIENT_KEY}"
          printf '%s\n' "${MTLS_CLIENT_CERT}" > /tmp/apply-client.crt
          printf '%s\n' "${MTLS_CLIENT_KEY}" > /tmp/apply-client.key
          chmod 600 /tmp/apply-client.key

      - name: Deploy request over mTLS
        run: |
          status_code="$(
            curl -sS -o /tmp/apply_response_body.txt -w '%{http_code}' \
              --request POST \
              --cert /tmp/apply-client.crt \
              --key /tmp/apply-client.key \
              --header 'Content-Type: application/json' \
              --data '{}' \
              https://apply.syumatsucamera.com/
          )"
          echo "apply endpoint status=${status_code}"
          if [ "${status_code}" != "200" ] && [ "${status_code}" != "202" ]; then
            echo "mTLS deploy request failed: unexpected status ${status_code}"
            cat /tmp/apply_response_body.txt
            exit 1
          fi

  # フェーズ4: 通知（成功/失敗とも送る）
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs:
      - ci
      - build_and_push
      - deploy
    if: always()
    steps:
      - name: Build notification metadata
        id: notify_meta
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SHA_SHORT: ${{ needs.build_and_push.outputs.sha_short }}
          ENV_NAME: ${{ vars.ENV_NAME }}
        run: |
          result_upper=$(printf '%s' "${DEPLOY_RESULT}" | tr '[:lower:]' '[:upper:]')
          echo "subject=[syumatsucamera][deploy][${result_upper}] ${SHA_SHORT} ${ENV_NAME}" >> "$GITHUB_OUTPUT"

      - name: Notification preview
        run: |
          echo "Subject: ${{ steps.notify_meta.outputs.subject }}"
          echo "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SMTP_HOST }}
          server_port: ${{ secrets.MAIL_SMTP_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.notify_meta.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          secure: true
          body: |
            repository: ${{ github.repository }}
            actor: ${{ github.actor }}
            branch: ${{ github.ref_name }}
            sha: ${{ github.sha }}
            ci_result: ${{ needs.ci.result }}
            build_push_result: ${{ needs.build_and_push.result }}
            deploy_result: ${{ needs.deploy.result }}
            run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
