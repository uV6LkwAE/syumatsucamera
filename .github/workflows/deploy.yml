name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: syumatsucamera-prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
  NODE_VERSION: ${{ vars.NODE_VERSION }}

jobs:
  # フェーズ1: CI（アプリの基本チェック）
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Django check
        working-directory: backend
        env:
          CI_SKIP_REQUIRED_ENV_CHECK: "True"
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          REDIS_URL: redis://127.0.0.1:6379/0
          REDIS_CONNECT_TIMEOUT: "1"
          REDIS_SOCKET_TIMEOUT: "1"
        run: python manage.py check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          rm -rf node_modules
          npm install --include=optional

      - name: Install rollup linux native package
        working-directory: frontend
        run: npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  # フェーズ2: Dockerイメージ Build / Push（本番は常時実行）
  build_and_push:
    name: Build And Push Images
    runs-on: ubuntu-latest
    needs:
      - ci
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      nginx_image: ${{ steps.meta.outputs.nginx_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${{ secrets.REGISTRY_HOST }}/${{ vars.REGISTRY_REPOSITORY }}/backend" >> "$GITHUB_OUTPUT"
          echo "nginx_image=${{ secrets.REGISTRY_HOST }}/${{ vars.REGISTRY_REPOSITORY }}/nginx" >> "$GITHUB_OUTPUT"

      - name: Configure Docker mTLS client certificate
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          MTLS_CLIENT_CERT_B64: ${{ secrets.MTLS_CLIENT_CERT_B64 }}
          MTLS_CLIENT_KEY_B64: ${{ secrets.MTLS_CLIENT_KEY_B64 }}
        run: |
          test -n "${REGISTRY_HOST}"
          test -n "${MTLS_CLIENT_CERT_B64}"
          test -n "${MTLS_CLIENT_KEY_B64}"

          tmp_cert="/tmp/registry-client.crt"
          tmp_key="/tmp/registry-client.key"
          printf '%s' "${MTLS_CLIENT_CERT_B64}" | base64 -d > "${tmp_cert}"
          printf '%s' "${MTLS_CLIENT_KEY_B64}" | base64 -d > "${tmp_key}"
          chmod 600 "${tmp_key}"

          openssl x509 -in "${tmp_cert}" -noout
          openssl pkey -in "${tmp_key}" -noout
          echo "registry_mtls_cert_serial=$(openssl x509 -in "${tmp_cert}" -noout -serial | cut -d= -f2 | tr '[:lower:]' '[:upper:]')"
          openssl x509 -in "${tmp_cert}" -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256 > /tmp/cert.pub.sha256
          openssl pkey -in "${tmp_key}" -pubout -outform der | openssl dgst -sha256 > /tmp/key.pub.sha256
          cmp /tmp/cert.pub.sha256 /tmp/key.pub.sha256

          for cert_dir in \
            "/etc/docker/certs.d/${REGISTRY_HOST}" \
            "/etc/docker/certs.d/${REGISTRY_HOST}:443"; do
            sudo mkdir -p "${cert_dir}"
            sudo cp "${tmp_cert}" "${cert_dir}/client.cert"
            sudo cp "${tmp_key}" "${cert_dir}/client.key"
            sudo chmod 644 "${cert_dir}/client.cert"
            sudo chmod 600 "${cert_dir}/client.key"
          done

          for cert_dir in \
            "${HOME}/.docker/certs.d/${REGISTRY_HOST}" \
            "${HOME}/.docker/certs.d/${REGISTRY_HOST}:443"; do
            mkdir -p "${cert_dir}"
            cp "${tmp_cert}" "${cert_dir}/client.cert"
            cp "${tmp_key}" "${cert_dir}/client.key"
            chmod 644 "${cert_dir}/client.cert"
            chmod 600 "${cert_dir}/client.key"
          done

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Debug registry host and cert directory
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
        run: |
          test -n "${REGISTRY_HOST}"
          echo "REGISTRY_HOST length=${#REGISTRY_HOST}"
          printf '%s' "${REGISTRY_HOST}" | od -An -tx1
          sudo ls -lb /etc/docker/certs.d
          sudo ls -lb "/etc/docker/certs.d/${REGISTRY_HOST}" || true
          sudo ls -lb "/etc/docker/certs.d/${REGISTRY_HOST}:443" || true
          sudo ls -l "/etc/docker/certs.d/${REGISTRY_HOST}" || true

      - name: Preflight registry access over mTLS
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          curl -fsS \
            --cert /tmp/registry-client.crt \
            --key /tmp/registry-client.key \
            -u "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" \
            "https://${REGISTRY_HOST}/v2/" > /dev/null

      - name: Build and push backend image
        run: |
          docker build \
            --file dockerfile/backend.dockerfile \
            --target runtime \
            --tag "${{ steps.meta.outputs.backend_image }}:latest" \
            --tag "${{ steps.meta.outputs.backend_image }}:${{ github.sha }}" \
            .

          echo "backend image history:"
          docker history --no-trunc --format 'id={{.ID}} size={{.Size}} created_by={{.CreatedBy}}' "${{ steps.meta.outputs.backend_image }}:latest"
          backend_layer_tmp="$(mktemp -d)"
          docker save "${{ steps.meta.outputs.backend_image }}:latest" -o "${backend_layer_tmp}/image.tar"
          tar -xf "${backend_layer_tmp}/image.tar" -C "${backend_layer_tmp}"
          echo "backend archive members (top 30 by size):"
          find "${backend_layer_tmp}" -type f -printf '%s\t%P\n' \
            | sort -nr -k1 \
            | head -n 30 \
            | while IFS=$'\t' read -r size path; do
              size_h="$(numfmt --to=iec --suffix=B "${size}")"
              echo "size=${size_h} member=${path}"
            done
          if find "${backend_layer_tmp}" -type f -name layer.tar | grep -q .; then
            echo "backend layer.tar sizes (raw/gzip):"
            find "${backend_layer_tmp}" -type f -name layer.tar -print0 \
              | while IFS= read -r -d '' layer_file; do
                raw_bytes="$(stat -c%s "${layer_file}")"
                gzip_bytes="$(gzip -c "${layer_file}" | wc -c)"
                raw_human="$(numfmt --to=iec --suffix=B "${raw_bytes}")"
                gzip_human="$(numfmt --to=iec --suffix=B "${gzip_bytes}")"
                layer_rel="${layer_file#${backend_layer_tmp}/}"
                printf "%s\t%s\t%s\t%s\t%s\n" "${gzip_bytes}" "${raw_bytes}" "${gzip_human}" "${raw_human}" "${layer_rel}"
              done | sort -nr -k1 \
              | while IFS=$'\t' read -r gzip_bytes raw_bytes gzip_human raw_human layer_rel; do
                echo "raw=${raw_human} gzip=${gzip_human} layer=${layer_rel}"
              done
          fi
          rm -rf "${backend_layer_tmp}"

          if ! command -v strace >/dev/null 2>&1; then
            echo "strace not found. run push without dockerd openat trace."
            docker push "${{ steps.meta.outputs.backend_image }}:latest"
          else
            trace_prefix="/tmp/dockerd-openat"
            sudo rm -f "${trace_prefix}"*
            dockerd_pid="$(pgrep -xo dockerd)"
            sudo strace -ff -e trace=openat -o "${trace_prefix}" -p "${dockerd_pid}" >/tmp/strace-attach.log 2>&1 &
            trace_pid=$!
            sleep 1
            set +e
            docker push "${{ steps.meta.outputs.backend_image }}:latest"
            push_latest_rc=$?
            set -e
            sudo kill "${trace_pid}" || true
            sleep 1
            echo "dockerd cert path lookup (openat):"
            sudo grep -R "certs.d" "${trace_prefix}"* | sort -u || true
            if [ "${push_latest_rc}" -ne 0 ]; then
              echo "backend latest push failed with code=${push_latest_rc}"
              exit "${push_latest_rc}"
            fi
          fi

          docker push "${{ steps.meta.outputs.backend_image }}:${{ github.sha }}"

      - name: Build and push nginx image
        run: |
          docker build \
            --file dockerfile/nginx.dockerfile \
            --target runtime \
            --tag "${{ steps.meta.outputs.nginx_image }}:latest" \
            --tag "${{ steps.meta.outputs.nginx_image }}:${{ github.sha }}" \
            .

          echo "nginx image history:"
          docker history --no-trunc --format 'id={{.ID}} size={{.Size}} created_by={{.CreatedBy}}' "${{ steps.meta.outputs.nginx_image }}:latest"
          nginx_layer_tmp="$(mktemp -d)"
          docker save "${{ steps.meta.outputs.nginx_image }}:latest" -o "${nginx_layer_tmp}/image.tar"
          tar -xf "${nginx_layer_tmp}/image.tar" -C "${nginx_layer_tmp}"
          echo "nginx archive members (top 30 by size):"
          find "${nginx_layer_tmp}" -type f -printf '%s\t%P\n' \
            | sort -nr -k1 \
            | head -n 30 \
            | while IFS=$'\t' read -r size path; do
              size_h="$(numfmt --to=iec --suffix=B "${size}")"
              echo "size=${size_h} member=${path}"
            done
          if find "${nginx_layer_tmp}" -type f -name layer.tar | grep -q .; then
            echo "nginx layer.tar sizes (raw/gzip):"
            find "${nginx_layer_tmp}" -type f -name layer.tar -print0 \
              | while IFS= read -r -d '' layer_file; do
                raw_bytes="$(stat -c%s "${layer_file}")"
                gzip_bytes="$(gzip -c "${layer_file}" | wc -c)"
                raw_human="$(numfmt --to=iec --suffix=B "${raw_bytes}")"
                gzip_human="$(numfmt --to=iec --suffix=B "${gzip_bytes}")"
                layer_rel="${layer_file#${nginx_layer_tmp}/}"
                printf "%s\t%s\t%s\t%s\t%s\n" "${gzip_bytes}" "${raw_bytes}" "${gzip_human}" "${raw_human}" "${layer_rel}"
              done | sort -nr -k1 \
              | while IFS=$'\t' read -r gzip_bytes raw_bytes gzip_human raw_human layer_rel; do
                echo "raw=${raw_human} gzip=${gzip_human} layer=${layer_rel}"
              done
          fi
          rm -rf "${nginx_layer_tmp}"

          docker push "${{ steps.meta.outputs.nginx_image }}:latest"
          docker push "${{ steps.meta.outputs.nginx_image }}:${{ github.sha }}"

  # フェーズ3: デプロイ（常時実行）
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - build_and_push
    timeout-minutes: 40
    environment: production
    steps:
      - name: Deploy phase plan
        run: |
          echo "Target endpoint: https://apply.syumatsucamera.com/"
          echo "Mode: mTLS request (POST)"

      - name: Configure mTLS cert for deploy request
        env:
          MTLS_CLIENT_CERT_B64: ${{ secrets.MTLS_CLIENT_CERT_B64 }}
          MTLS_CLIENT_KEY_B64: ${{ secrets.MTLS_CLIENT_KEY_B64 }}
        run: |
          test -n "${MTLS_CLIENT_CERT_B64}"
          test -n "${MTLS_CLIENT_KEY_B64}"
          printf '%s' "${MTLS_CLIENT_CERT_B64}" | base64 -d > /tmp/apply-client.crt
          printf '%s' "${MTLS_CLIENT_KEY_B64}" | base64 -d > /tmp/apply-client.key
          chmod 600 /tmp/apply-client.key
          openssl x509 -in /tmp/apply-client.crt -noout
          openssl pkey -in /tmp/apply-client.key -noout

      - name: Deploy request over mTLS
        id: deploy_request
        run: |
          status_code="$(
            curl -sS -o /tmp/apply_response_body.txt -w '%{http_code}' \
              --request POST \
              --cert /tmp/apply-client.crt \
              --key /tmp/apply-client.key \
              --header 'Content-Type: application/json' \
              --data '{}' \
              https://apply.syumatsucamera.com/
          )"
          echo "apply endpoint status=${status_code}"
          if [ "${status_code}" != "202" ]; then
            echo "mTLS deploy request failed: unexpected status ${status_code}"
            cat /tmp/apply_response_body.txt
            exit 1
          fi
          job_id="$(tr -d '\n' < /tmp/apply_response_body.txt)"
          test -n "${job_id}"
          echo "apply job id=${job_id}"
          echo "job_id=${job_id}" >> "$GITHUB_OUTPUT"

      - name: Poll apply status over mTLS
        run: |
          started_at="$(date +%s)"
          timeout_seconds=1800
          interval_seconds=60

          while true; do
            now="$(date +%s)"
            elapsed="$((now - started_at))"
            if [ "${elapsed}" -ge "${timeout_seconds}" ]; then
              echo "apply polling timed out after ${elapsed} seconds"
              exit 1
            fi

            status_code="$(
              curl -sS -o /tmp/apply_status_body.txt -w '%{http_code}' \
                --cert /tmp/apply-client.crt \
                --key /tmp/apply-client.key \
                "https://apply.syumatsucamera.com/status/${{ steps.deploy_request.outputs.job_id }}"
            )"

            if [ "${status_code}" != "200" ]; then
              echo "apply status endpoint failed: unexpected status ${status_code}"
              cat /tmp/apply_status_body.txt
              exit 1
            fi

            status="$(
              python -c 'import json,sys; print(json.load(open("/tmp/apply_status_body.txt"))["status"])'
            )"
            detail="$(
              python -c 'import json; data=json.load(open("/tmp/apply_status_body.txt")); print(data.get("detail", ""))'
            )"
            echo "apply status=${status} elapsed=${elapsed}s"

            if [ "${status}" = "success" ]; then
              exit 0
            fi

            if [ "${status}" = "failed" ]; then
              if [ -n "${detail}" ]; then
                echo "apply detail=${detail}"
              fi
              exit 1
            fi

            if [ "${status}" != "running" ]; then
              echo "unexpected apply status: ${status}"
              if [ -n "${detail}" ]; then
                echo "apply detail=${detail}"
              fi
              exit 1
            fi

            sleep "${interval_seconds}"
          done

  # フェーズ4: 通知（成功/失敗とも送る）
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs:
      - ci
      - build_and_push
      - deploy
    if: always()
    steps:
      - name: Build notification metadata
        id: notify_meta
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SHA_SHORT: ${{ needs.build_and_push.outputs.sha_short }}
          ENV_NAME: ${{ vars.ENV_NAME }}
        run: |
          result_upper=$(printf '%s' "${DEPLOY_RESULT}" | tr '[:lower:]' '[:upper:]')
          echo "subject=[syumatsucamera][deploy][${result_upper}] ${SHA_SHORT} ${ENV_NAME}" >> "$GITHUB_OUTPUT"

      - name: Notification preview
        run: |
          echo "Subject: ${{ steps.notify_meta.outputs.subject }}"
          echo "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Send mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SMTP_HOST }}
          server_port: ${{ secrets.MAIL_SMTP_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.notify_meta.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          secure: true
          body: |
            repository: ${{ github.repository }}
            actor: ${{ github.actor }}
            branch: ${{ github.ref_name }}
            sha: ${{ github.sha }}
            ci_result: ${{ needs.ci.result }}
            build_push_result: ${{ needs.build_and_push.result }}
            deploy_result: ${{ needs.deploy.result }}
            run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
