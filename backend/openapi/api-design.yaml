      operationId: listCmsOgp
      security:
        - CloudflareAccessJwt:
            - admin
      x-permission-class: AdminOnlyReadWrite
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 正常
