components:
  securitySchemes:
    CloudflareAccessJwt:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: 記事管理 / ユーザー管理 / OGP管理 / 招待本登録などの Access 保護対象APIで Cloudflare Access が付与するJWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      description: 返却するオブジェクト件数。未指定時は各APIのデフォルト件数を用いる。
      schema:
        type: integer
        minimum: 1
        maximum: 100
    SearchQuery:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    CmsArticleOrdering:
      name: ordering
      in: query
      required: false
      schema:
        type: string
        enum:
          - newest
          - oldest
          - popular
        default: newest
    CmsArticleStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - draft
          - publish
          - private
    CmsArticleAuthor:
      name: author
      in: query
      required: false
      schema:
        type: string
        format: uuid
    CmsArticleTitle:
      name: title
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    ArticleId:
      name: article_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: category_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OgpId:
      name: ogp_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PublishRequestId:
      name: publish_request_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LockToken:
      name: lock_token
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LockTokenQuery:
      name: lock_token
      in: query
      required: false
      schema:
        type: string
        format: uuid
    RequestUserId:
      name: request_user_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    OccurredAtFrom:
      name: occurred_at_from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    OccurredAtTo:
      name: occurred_at_to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    ArticleSaveLogTarget:
      name: target
      in: query
      required: false
      schema:
        type: string
    ArticleSaveLogStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - failed
          - started
          - completed
    CategorySlug:
      name: category_slug
      in: path
      required: true
      schema:
        type: string
    ArticleSlug:
      name: article_slug
      in: path
      required: true
      schema:
        type: string
    TagSlug:
      name: tag_slug
      in: path
      required: true
      schema:
        type: string
