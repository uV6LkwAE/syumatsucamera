components:
  schemas:
    SystemHealthResponse:
      type: object
      required:
        - status
        - db
        - redis
      properties:
        status:
          type: string
          enum:
            - ok
            - ng
        db:
          type: boolean
        redis:
          type: boolean
        db_error:
          type: string
        redis_error:
          type: string
    SystemDevAccessToken:
      type: object
      required:
        - token_type
        - token
        - expires_at
        - email
        - sub
      properties:
        token_type:
          type: string
          example: Bearer
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        email:
          type: string
          format: email
        sub:
          type: string
    CommonDetailError:
      type: object
      required:
        - detail
        - code
      properties:
        detail:
          type: string
        code:
          type: string
    CommonValidationError:
      type: object
      required:
        - detail
        - code
        - errors
      properties:
        detail:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            oneOf:
              - type: array
                maxItems: 20
                items:
                  type: string
              - type: string
              - type: object
    CommonPagination:
      type: object
      required:
        - page
        - page_size
        - total_count
        - total_pages
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_count:
          type: integer
        total_pages:
          type: integer
    CmsCategorySummary:
      type: object
      required:
        - id
        - name
        - slug
        - path
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        path:
          type: string
    PublicCategorySummary:
      type: object
      required:
        - id
        - name
        - path
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        path:
          type: string
    PublicCategoryTreeItem:
      type: object
      required:
        - id
        - name
        - slug
        - path
        - article_count
        - children
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        path:
          type: string
        article_count:
          type: integer
        children:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PublicCategoryTreeItem"
    PublicAuthorSummary:
      type: object
      required:
        - id
        - display_name
        - profile
        - icon
        - header_image
        - x_url
        - instagram_url
        - website_url
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        profile:
          type: string
        icon:
          type:
            - string
            - "null"
        header_image:
          type:
            - string
            - "null"
        x_url:
          type:
            - string
            - "null"
        instagram_url:
          type:
            - string
            - "null"
        website_url:
          type:
            - string
            - "null"
    UsersAuthorSummary:
      type: object
      required:
        - id
        - display_name
        - icon
        - header_image
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        icon:
          type:
            - string
            - "null"
        header_image:
          type:
            - string
            - "null"
    PublicProfile:
      allOf:
        - $ref: "#/components/schemas/PublicAuthorSummary"
    CmsTagSummary:
      type: object
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    CmsTagSuggestion:
      allOf:
        - $ref: "#/components/schemas/CmsTagSummary"
        - type: object
          required:
            - article_count
          properties:
            article_count:
              type: integer
              minimum: 0
    CmsTagSuggestionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/CmsTagSuggestion"
    PublicSidebarTag:
      type: object
      required:
        - id
        - name
        - slug
        - path
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        path:
          type: string
    PublicArticleSummary:
      type: object
      required:
        - id
        - title
        - summary
        - published_at
        - views_total
        - is_profit
        - category
        - author
        - thumbnail_url
        - thumbnail_width
        - thumbnail_height
        - path
        - article_option
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        published_at:
          type: string
          format: date-time
        views_total:
          type: integer
        is_profit:
          type: boolean
        thumbnail_url:
          type: string
          format: uri
        thumbnail_width:
          type: integer
        thumbnail_height:
          type: integer
        path:
          type: string
        category:
          $ref: "#/components/schemas/PublicCategorySummary"
        author:
          $ref: "#/components/schemas/PublicAuthorSummary"
        article_option:
          $ref: "#/components/schemas/ArticleOption"
    PublicArticleMeta:
      type: object
      required:
        - title
        - description
        - canonical_url
        - og_image_url
        - is_profit
        - twitter_card
      properties:
        title:
          type: string
        description:
          type: string
        canonical_url:
          type: string
          format: uri
        og_image_url:
          type: string
          format: uri
        is_profit:
          type: boolean
        twitter_card:
          type: string
          enum:
            - summary
            - summary_large_image
    PublicArticleList:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PublicArticleSummary"
        pagination:
          $ref: "#/components/schemas/CommonPagination"
    PublicSidebar:
      type: object
      required:
        - profile
        - category_tree
        - tags
      properties:
        profile:
          $ref: "#/components/schemas/PublicProfile"
        category_tree:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PublicCategoryTreeItem"
        tags:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PublicSidebarTag"
    PublicSiteConfig:
      type: object
      required:
        - turnstile_site_key
      properties:
        turnstile_site_key:
          type: string
          minLength: 1
    CmsTocNode:
      type: object
      required:
        - level
        - id
        - text
        - children
      properties:
        level:
          type: integer
          enum:
            - 1
            - 2
            - 3
        id:
          type: string
        text:
          type: string
        children:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CmsTocNode"
    OgpRecord:
      type: object
      required:
        - id
        - url
      properties:
        id:
          type: string
          format: uuid
        article_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        title:
          type: string
        summary:
          type: string
        thumbnail:
          type: string
          format: uri
        price:
          type: string
          nullable: true
        is_associates:
          type: boolean
          nullable: true
        site_name:
          type: string
        updated_at:
          type: string
          format: date-time
    PublicArticleDetail:
      type: object
      required:
        - article
        - related_articles
        - cdn_base_url
      properties:
        article:
          type: object
          required:
            - id
            - title
            - summary
            - body_html
            - status
            - published_at
            - views_total
            - category
            - category_breadcrumb
            - author
            - tags
            - toc
            - ogp_by_url
            - thumbnail_url
            - thumbnail_width
            - thumbnail_height
            - twitter_card
            - article_option
            - path
          properties:
            id:
              type: string
              format: uuid
            title:
              type: string
            summary:
              type: string
            body_html:
              type: string
            status:
              type: string
              enum:
                - publish
            published_at:
              type: string
              format: date-time
            views_total:
              type: integer
            thumbnail_url:
              type: string
              format: uri
            thumbnail_width:
              type: integer
            thumbnail_height:
              type: integer
            path:
              type: string
            twitter_card:
              type: string
              enum:
                - summary
                - summary_large_image
            article_option:
              $ref: "#/components/schemas/ArticleOption"
            category:
              $ref: "#/components/schemas/PublicCategorySummary"
            category_breadcrumb:
              type: array
              maxItems: 20
              items:
                $ref: "#/components/schemas/PublicCategorySummary"
            author:
              $ref: "#/components/schemas/PublicAuthorSummary"
            tags:
              type: array
              maxItems: 20
              items:
                $ref: "#/components/schemas/CmsTagSummary"
            toc:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/CmsTocNode"
            ogp_by_url:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/OgpRecord"
        related_articles:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/PublicArticleSummary"
        cdn_base_url:
          type: string
          format: uri
    ContactsCreateRequest:
      type: object
      required:
        - subject_type
        - person_name
        - email
        - body
        - turnstile_token
      properties:
        subject_type:
          type: string
          enum:
            - review
            - blog
        company_name:
          type: string
        person_name:
          type: string
        email:
          type: string
          format: email
        body:
          type: string
        turnstile_token:
          type: string
    ContactsCreateResponse:
      type: object
      required:
        - id
        - message
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
    UsersSessionUser:
      type: object
      required:
        - id
        - email
        - display_name
        - icon
        - header_image
        - x_url
        - instagram_url
        - website_url
        - role
        - is_active
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type:
            - string
            - "null"
        icon:
          type:
            - string
            - "null"
        header_image:
          type:
            - string
            - "null"
        x_url:
          type:
            - string
            - "null"
          format: uri
        instagram_url:
          type:
            - string
            - "null"
          format: uri
        website_url:
          type:
            - string
            - "null"
          format: uri
        profile:
          type:
            - string
            - "null"
        meta:
          type: object
          additionalProperties:
            type: string
        meta_help_text:
          type: string
        role:
          type: string
          enum:
            - admin
            - author
        is_active:
          type: boolean
    UsersSessionProfileUpdateRequest:
      type: object
      required:
        - email
        - display_name
        - profile
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        icon:
          type:
            - string
            - "null"
        icon_file:
          type: string
          format: binary
        header_image:
          type:
            - string
            - "null"
        header_image_file:
          type: string
          format: binary
        profile:
          type: string
        x_url:
          type:
            - string
            - "null"
          format: uri
        instagram_url:
          type:
            - string
            - "null"
          format: uri
        website_url:
          type:
            - string
            - "null"
          format: uri
        meta:
          type: object
          additionalProperties:
            type: string
    CmsArticleSummary:
      type: object
      required:
        - id
        - title
        - path
        - status
        - is_profit
        - author
        - category
        - article_option
        - views_total
        - image_job_status
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        path:
          type: string
        status:
          type: string
          enum:
            - draft
            - publish
            - private
        is_profit:
          type: boolean
        author:
          $ref: "#/components/schemas/UsersAuthorSummary"
        category:
          $ref: "#/components/schemas/CmsCategorySummary"
        article_option:
          $ref: "#/components/schemas/CmsArticleOptionResponse"
        views_total:
          type: integer
        image_job_status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
        updated_at:
          type: string
          format: date-time
    CmsArticleList:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CmsArticleSummary"
        pagination:
          $ref: "#/components/schemas/CommonPagination"
    CmsArticleAuthorOption:
      type: object
      required:
        - id
        - display_name
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
    CmsArticleAuthorOptionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CmsArticleAuthorOption"
    CmsArticleOptionItem:
      type: object
      required:
        - id
        - code
        - label
        - description
        - is_system
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        label:
          type: string
        description:
          type: string
        is_system:
          type: boolean
    CmsArticleOptionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CmsArticleOptionItem"
    ArticleOption:
      type: object
      required:
        - is_pr
        - is_ad
        - items
      properties:
        is_pr:
          type: boolean
        is_ad:
          type: boolean
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CmsArticleOptionItem"
    CmsArticleOptionResponse:
      type: object
      required:
        - is_pr
        - is_ad
        - items
      properties:
        is_pr:
          type: boolean
        is_ad:
          type: boolean
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CmsArticleOptionItem"
    CmsArticleOptionRequest:
      type: object
      properties:
        selected_option_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
    CmsArticleOptionCreateUpdateRequest:
      type: object
      required:
        - label
        - description
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          minLength: 1
    MediaAssetImageProcessingOptions:
      type: object
      required:
        - exif_watermark
        - site_logo_watermark
      properties:
        exif_watermark:
          type: boolean
        site_logo_watermark:
          type: boolean
    MediaAssetNewImage:
      type: object
      required:
        - file_name
        - options
      properties:
        file_name:
          type: string
        original_file_path:
          type: string
        options:
          $ref: "#/components/schemas/MediaAssetImageProcessingOptions"
    MediaAssetThumbnailRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - use_uploaded
            - use_default
            - generate_from_title
            - keep_current
        file_name:
          type: string
        title_text:
          type: string
    CmsArticleImageUploadRequest:
      type: object
      required:
        - lock_token
        - file
      properties:
        lock_token:
          type: string
          format: uuid
        file:
          type: string
          format: binary
          description: jpg/jpeg/gif のみ許可する。png/webp は許可しない。
    CmsArticleImageUploadResponse:
      type: object
      required:
        - file_name
        - path
      properties:
        file_name:
          type: string
        path:
          type: string
    MediaAssetImageDiff:
      type: object
      required:
        - lock_token
        - new_images
        - delete_images
        - thumbnail_request
      properties:
        lock_token:
          type: string
          format: uuid
        new_images:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MediaAssetNewImage"
        delete_images:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        thumbnail_request:
          $ref: "#/components/schemas/MediaAssetThumbnailRequest"
    CmsArticleUpsertRequest:
      type: object
      required:
        - category_id
        - title
        - summary
        - body_html
        - status
        - article_option
        - image_diff
      properties:
        category_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
          maxLength: 200
        body_html:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - draft
            - publish
            - private
        tag_ids:
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
        tag_names:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 100
        twitter_card:
          type: string
          enum:
            - summary
            - summary_large_image
          default: summary_large_image
        is_profit:
          type: boolean
          default: true
        article_option:
          $ref: "#/components/schemas/CmsArticleOptionRequest"
        image_diff:
          $ref: "#/components/schemas/MediaAssetImageDiff"
    CmsArticleMutationResponse:
      type: object
      required:
        - article
        - postprocess_job
      properties:
        article:
          $ref: "#/components/schemas/CmsArticle"
        postprocess_job:
          $ref: "#/components/schemas/SystemAcceptedJob"
    CmsArticle:
      type: object
      required:
        - id
        - category_id
        - author_id
        - author
        - title
        - path
        - slug
        - summary
        - body_html
        - status
        - is_profit
        - views_total
        - thumbnail_asset_id
        - thumbnail_preview_path
        - twitter_card
        - article_option
        - tags
        - toc
        - image_job_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        author:
          $ref: "#/components/schemas/UsersAuthorSummary"
        title:
          type: string
        path:
          type: string
        slug:
          type: string
        summary:
          type: string
        body_html:
          type: string
        status:
          type: string
          enum:
            - draft
            - publish
            - private
        is_profit:
          type: boolean
        published_at:
          type: string
          format: date-time
        views_total:
          type: integer
        thumbnail_asset_id:
          type: string
          format: uuid
        thumbnail_preview_path:
          type: string
        twitter_card:
          type: string
          enum:
            - summary
            - summary_large_image
        article_option:
          $ref: "#/components/schemas/CmsArticleOptionResponse"
        tags:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/CmsTagSummary"
        toc:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CmsTocNode"
        image_job_status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
        lock:
          $ref: "#/components/schemas/CmsArticleSession"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CmsArticleSessionCreateRequest:
      type: object
      properties:
        article_id:
          type: string
          format: uuid
    CmsArticleSession:
      type: object
      required:
        - default_thumbnail_preview_path
        - lock_token
        - locked_by
        - lock_expires_at
      properties:
        article_id:
          type: string
          format: uuid
        default_thumbnail_preview_path:
          type: string
        lock_token:
          type: string
          format: uuid
        locked_by_id:
          type: string
          format: uuid
        locked_by:
          $ref: "#/components/schemas/UsersAuthorSummary"
        lock_expires_at:
          type: string
          format: date-time
    CmsPublishRequestCreateRequest:
      type: object
      properties:
        note:
          type: string
    CmsPublishRequestRejectRequest:
      type: object
      properties:
        note:
          type: string
    CmsPublishRequest:
      type: object
      required:
        - id
        - article_id
        - article
        - requested_by
        - requested_at
        - status
      properties:
        id:
          type: string
          format: uuid
        article_id:
          type: string
          format: uuid
        article:
          $ref: "#/components/schemas/CmsArticleSummary"
        requested_by_id:
          type: string
          format: uuid
        requested_by:
          $ref: "#/components/schemas/UsersAuthorSummary"
        requested_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        handled_by_id:
          type: string
          format: uuid
        handled_by:
          $ref: "#/components/schemas/UsersAuthorSummary"
        handled_at:
          type: string
          format: date-time
        note:
          type: string
    CmsPublishRequestList:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CmsPublishRequest"
        pagination:
          $ref: "#/components/schemas/CommonPagination"
    CmsArticleSaveLog:
      type: object
      required:
        - occurred_at
        - article_id
        - request_user_id
        - request_user
        - lock_token
        - status
      properties:
        occurred_at:
          type: string
          format: date-time
        article_id:
          type:
            - string
            - "null"
          format: uuid
        request_user_id:
          type: string
          format: uuid
        request_user:
          $ref: "#/components/schemas/UsersAuthorSummary"
        lock_token:
          type: string
          format: uuid
        target:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - failed
            - started
            - completed
        message:
          type:
            - string
            - "null"
    CmsArticleSaveLogList:
      type: object
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CmsArticleSaveLog"
        pagination:
          $ref: "#/components/schemas/CommonPagination"
    CmsCategoryCreateRequest:
      type: object
      required:
        - name
      properties:
