apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
      listen 80;
      server_name syumatsucamera.com;

      client_max_body_size 20M;
      root /usr/share/nginx/html;
      index index.html;

      location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }

    server {
      listen 80;
      server_name cms.syumatsucamera.com;

      client_max_body_size 30M;

      location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }

    server {
      listen 80;
      server_name media.syumatsucamera.com;

      access_log /var/log/nginx/media_access.log;
      error_log /var/log/nginx/media_error.log;

      autoindex off;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer-when-downgrade always;

      error_page 404 = @notfound;

      location @notfound {
        add_header Cache-Control "no-store" always;
        return 404;
      }

      location ^~ /media/articles/ {
        alias /media/derived/articles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
      }

      location / {
        return 404;
      }

      location ~* \.(?:php|pl|py|sh|cgi)$ {
        return 403;
      }
    }

    server {
      listen 80;
      server_name registry.syumatsucamera.com;

      client_max_body_size 2G;

      location / {
        proxy_pass http://192.168.1.25:5000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
      }
    }

    server {
      listen 80;
      server_name apply.syumatsucamera.com;

      client_max_body_size 1M;

      location / {
        if ($request_method != POST) {
          return 405;
        }

        proxy_pass http://192.168.1.20:19081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
      }

      location ^~ /status/ {
        if ($request_method != GET) {
          return 405;
        }

        proxy_pass http://192.168.1.20:19081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
      }
    }
