services:
  nginx:
    build:
      context: ..
      dockerfile: dockerfile/nginx.dockerfile
    container_name: nginx-prod
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: dockerfile/backend.dockerfile
      target: runtime
    container_name: backend-prod
    working_dir: /app
    env_file:
      - ../.env.prod
    command:
      - /bin/sh
      - -ec
      - |
        python manage.py migrate --noinput
        exec gunicorn "$${DJANGO_WSGI_MODULE:-syumatsucamera.wsgi}:application" \
          --bind 0.0.0.0:8000 \
          --workers "$${GUNICORN_WORKERS:-3}"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: dockerfile/backend.dockerfile
      target: runtime
    container_name: worker-prod
    working_dir: /app
    env_file:
      - ../.env.prod
    command:
      - /bin/sh
      - -ec
      - exec celery -A "$${CELERY_APP_MODULE:-syumatsucamera}" worker -l info
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  cronjob:
    build:
      context: ..
      dockerfile: dockerfile/backend.dockerfile
      target: runtime
    container_name: cronjob-prod
    working_dir: /app
    env_file:
      - ../.env.prod
    command: ["/bin/sh", "-ec", "while true; do python manage.py pv_flush && sleep 1800; done"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    build:
      context: ..
      dockerfile: dockerfile/postgres.dockerfile
    container_name: postgres-prod
    env_file:
      - ../.env.prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    build:
      context: ..
      dockerfile: dockerfile/redis.dockerfile
    container_name: redis-prod
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  ollama:
    build:
      context: ..
      dockerfile: dockerfile/ollama.dockerfile
    container_name: ollama-prod
    environment:
      OLLAMA_KEEP_ALIVE: -1
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    build:
      context: ..
      dockerfile: dockerfile/ollama.dockerfile
    container_name: ollama-init-prod
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: gemma2:2b
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          if ollama list >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        ollama pull "$${OLLAMA_MODEL}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_prod_data:
  redis_prod_data:
  ollama_data:
