services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-dev
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ../dockerfile/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: dockerfile/frontend.dockerfile
      target: dev
    container_name: frontend-dev
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "5173"
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: dockerfile/backend.dockerfile
      target: dev
    container_name: backend-dev
    working_dir: /app
    env_file:
      - ../.env.dev
    command: ["/bin/sh", "-ec", "python manage.py migrate --noinput && exec python manage.py runserver 0.0.0.0:8000"]
    volumes:
      - ../backend:/app
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres-dev
    env_file:
      - ../.env.dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  ollama:
    build:
      context: ..
      dockerfile: dockerfile/ollama.dockerfile
    container_name: ollama-dev
    environment:
      OLLAMA_KEEP_ALIVE: -1
    ports:
      - "11434:11434"
    volumes:
      - ollama_dev_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  ollama-init:
    build:
      context: ..
      dockerfile: dockerfile/ollama.dockerfile
    container_name: ollama-init-dev
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: gemma2:2b
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          if ollama list >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        ollama pull "$${OLLAMA_MODEL}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_dev_data:
  redis_dev_data:
  frontend_node_modules:
  ollama_dev_data:
